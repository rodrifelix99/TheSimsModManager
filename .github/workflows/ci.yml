name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    name: Analyze & test (${{ matrix.os }})
    # Windows is where most users are, and where the path rules, the
    # drive-letter folder guessing and the shelled-out tools behave
    # differently enough to be worth a runner of their own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The runners under windows/, macos/ and linux/ are hand-edited C++, Swift
  # and plists that `flutter test` never touches: the window chrome, and the
  # single-instance plumbing simsmodmanager:// links arrive through. Nothing
  # else compiles them until the release workflow does, and finding out then
  # means finding out from a tag. Compiling all three here is a few minutes
  # per push for the guarantee that a release can be cut at any time.
  build:
    name: Build the app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # GTK and the audio stack the Linux bundle links against.
      #
      # The runner image also carries Microsoft's own azure-cli apt repo,
      # which this build never touches; when Microsoft rotates that repo
      # out from under the image (403, "no longer signed") apt-get update
      # fails on a source we never asked for. Drop it before updating -
      # everything we install here lives in Ubuntu's own repos.
      - if: matrix.target == 'linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      # flutter_acrylic's macOS side is CocoaPods-only.
      - if: matrix.target == 'macos'
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      # Unsigned: this is a compile check, not an artifact. The release
      # workflow is the only thing that produces something to hand out,
      # and it pins its own Flutter version for reasons of its own.
      - run: flutter build ${{ matrix.target }} --release
      # The disk image is assembled by a Finder script that only the release
      # workflow runs, right at the end, on a tag. Same bargain as the runners
      # above: build one here, unsigned and thrown away, so a layout that
      # stopped assembling is a push away rather than a tag away.
      - if: matrix.target == 'macos'
        run: |
          brew install create-dmg
          installer/macos/make_dmg.sh build/smoke.dmg \
            "build/macos/Build/Products/Release/The Sims Mod Manager.app"
      # Same bargain for the Linux tarball, which the release workflow
      # likewise assembles by script. The launcher gets exercised here as
      # well: run with no bundle around it, it has to say so and refuse,
      # which is the half of it a machine with no display can still check.
      - if: matrix.target == 'linux'
        run: |
          installer/linux/package.sh build/smoke.tar.gz \
            build/linux/x64/release/bundle 0.0.0
          # Listed to a file rather than piped: grep -q closes the pipe on
          # its first match, and under pipefail tar dying of SIGPIPE would
          # fail this step the day the listing outgrows the pipe buffer.
          tar -tzf build/smoke.tar.gz > build/smoke.list
          for entry in TheSimsModManager.sh sims_mod_manager lib/libapp.so; do
            grep -qx "TheSimsModManager-0.0.0/$entry" build/smoke.list
          done
          # No display for the launcher to put a dialog on: it has one for
          # the desktop entry's sake, and zenity would wait here for a
          # click nobody is coming to give it.
          ! DISPLAY= WAYLAND_DISPLAY= installer/linux/TheSimsModManager.sh \
            2> /dev/null

  site:
    name: Build the website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
