name: sims_mod_manager
description: Cross-platform desktop mod manager for The Sims series (and future moddable games).
publish_to: "none"
version: 2.3.6
environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  audioplayers: ^6.1.0
  path: ^1.9.0
  file_selector: ^1.0.3
  flutter_acrylic: ^1.1.4
  shared_preferences: ^2.3.0
  window_manager: ^0.5.2
  archive: ^4.0.9
  # SHA-256 for the duplicate scan (core/duplicates.dart). Pure Dart and
  # already in the lock as a transitive dependency; 3.0.7 asks for Dart
  # 3.4, well below what the release pin ships.
  crypto: ^3.0.7
  desktop_drop: ^0.7.1
  # Held below 7.1.0 deliberately: from there app_links wants Dart 3.12 and
  # Flutter 3.44, and release.yml is pinned to 3.41.9 until
  # flutter/flutter#189183 is fixed. Raising this breaks the release build
  # (pub get fails before anything compiles), which CI cannot see, because
  # it resolves against an unpinned stable.
  app_links: ">=7.0.0 <7.1.0"
  win32_registry: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/games/icons/
    - assets/games/logos/
    - assets/packs/sims1/
    - assets/packs/sims2/
    - assets/packs/sims4/
    - assets/plumbobs/
    - assets/sounds/s1/ui/
    - assets/pirate-icon.webp
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
